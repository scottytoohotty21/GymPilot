<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GymPilot Theme Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-start: #0284c7;
      --bg-end: #0ea5e9;
      --glow-one: rgba(186, 230, 253, 0.42);
      --glow-two: rgba(7, 89, 133, 0.35);
      --accent: #38bdf8;
      --button-text: #082f49;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, var(--glow-one), transparent 38%),
        radial-gradient(circle at bottom right, var(--glow-two), transparent 36%),
        linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      padding: 18px;
    }

    body.full-blue {
      --bg-start: #0284c7;
      --bg-end: #0ea5e9;
      --glow-one: rgba(186, 230, 253, 0.42);
      --glow-two: rgba(7, 89, 133, 0.35);
      --accent: #38bdf8;
      --button-text: #082f49;
    }

    body.full-pink {
      --bg-start: #db2777;
      --bg-end: #f472b6;
      --glow-one: rgba(252, 231, 243, 0.46);
      --glow-two: rgba(131, 24, 67, 0.38);
      --accent: #f9a8d4;
      --button-text: #500724;
    }

    body.hot-pink {
      --bg-start: #be185d;
      --bg-end: #ec4899;
      --glow-one: rgba(253, 164, 175, 0.46);
      --glow-two: rgba(80, 7, 36, 0.42);
      --accent: #fbcfe8;
      --button-text: #500724;
    }

    body.electric-blue {
      --bg-start: #0369a1;
      --bg-end: #38bdf8;
      --glow-one: rgba(224, 242, 254, 0.55);
      --glow-two: rgba(12, 74, 110, 0.42);
      --accent: #bae6fd;
      --button-text: #082f49;
    }

    .app-shell {
      width: min(820px, 100%);
      margin: 0 auto;
    }

    .theme-buttons {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px 0 14px;
      backdrop-filter: blur(10px);
    }

    .theme-button {
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(15, 23, 42, 0.68);
      color: #f9fafb;
      border-radius: 14px;
      padding: 11px 12px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }

    .theme-button.active {
      background: rgba(255,255,255,0.92);
      color: #111827;
      border-color: transparent;
    }

    .preview-card {
      background: rgba(15, 23, 42, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(14px);
      margin-top: 12px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(2.3rem, 10vw, 4rem);
      letter-spacing: -0.06em;
    }

    h2 {
      margin: 0 0 12px;
    }

    p {
      color: #d1d5db;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .main-button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 900;
      background: var(--accent);
      color: var(--button-text);
    }

    .secondary-button {
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 900;
      background: rgba(255,255,255,0.14);
      color: #f9fafb;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 14px;
    }

    .stat-number {
      display: block;
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      color: var(--accent);
    }

    .stat-label {
      color: #d1d5db;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .sample-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .sample-item {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(15, 23, 42, 0.72);
      border-radius: 18px;
      padding: 14px;
    }

    .sample-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .sample-item span {
      color: #d1d5db;
    }

    .hex {
      margin-top: 16px;
      font-family: monospace;
      color: #e5e7eb;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .theme-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="full-blue">

  <div class="app-shell">

    <div class="theme-buttons">
      <button class="theme-button active" data-theme="full-blue">Full Blue</button>
      <button class="theme-button" data-theme="electric-blue">Electric Blue</button>
      <button class="theme-button" data-theme="full-pink">Full Pink</button>
      <button class="theme-button" data-theme="hot-pink">Hot Pink</button>
    </div>

    <div class="preview-card">
      <h1>GymPilot</h1>
      <h2 id="themeTitle">Scott — Full Blue</h2>
      <p id="themeDescription">A proper blue background, not just blue highlights.</p>

      <div class="button-row">
        <button class="main-button">Start workout</button>
        <button class="secondary-button">Build routine</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-number">4</span>
          <span class="stat-label">Routines</span>
        </div>

        <div class="stat">
          <span class="stat-number">18</span>
          <span class="stat-label">Exercises</span>
        </div>

        <div class="stat">
          <span class="stat-number">7</span>
          <span class="stat-label">Workouts</span>
        </div>

        <div class="stat">
          <span class="stat-number">11</span>
          <span class="stat-label">PBs</span>
        </div>
      </div>

      <div class="sample-list">
        <div class="sample-item">
          <strong>Latest PB</strong>
          <span>Bench Press • Heaviest weight / resistance: 70</span>
        </div>

        <div class="sample-item">
          <strong>Last workout</strong>
          <span>Push Day • 6 completed sets</span>
        </div>
      </div>

      <div class="hex" id="themeHex">
        Background: #0284c7 → #0ea5e9<br />
        Accent: #38bdf8
      </div>
    </div>

  </div>

  <script>
    const themes = {
      "full-blue": {
        title: "Scott — Full Blue",
        description: "A proper blue background, not just blue highlights.",
        hex: "Background: #0284c7 → #0ea5e9<br />Accent: #38bdf8"
      },
      "electric-blue": {
        title: "Scott — Electric Blue",
        description: "A brighter, punchier blue background. More gym-app energy.",
        hex: "Background: #0369a1 → #38bdf8<br />Accent: #bae6fd"
      },
      "full-pink": {
        title: "Laurie — Full Pink",
        description: "A proper pink background with soft rose energy.",
        hex: "Background: #db2777 → #f472b6<br />Accent: #f9a8d4"
      },
      "hot-pink": {
        title: "Laurie — Hot Pink",
        description: "More vivid pink. Louder, stronger, definitely not shy.",
        hex: "Background: #be185d → #ec4899<br />Accent: #fbcfe8"
      }
    };

    const buttons = document.querySelectorAll(".theme-button");
    const title = document.getElementById("themeTitle");
    const description = document.getElementById("themeDescription");
    const hex = document.getElementById("themeHex");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const theme = button.dataset.theme;

        document.body.className = theme;

        buttons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");

        title.innerHTML = themes[theme].title;
        description.innerHTML = themes[theme].description;
        hex.innerHTML = themes[theme].hex;
      });
    });
  </script>

</body>
</html>
