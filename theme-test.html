<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GymPilot Theme Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-start: #020617;
      --bg-end: #0f172a;
      --glow-one: rgba(56, 189, 248, 0.22);
      --glow-two: rgba(14, 165, 233, 0.13);
      --accent: #38bdf8;
      --button-text: #082f49;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, var(--glow-one), transparent 34%),
        radial-gradient(circle at bottom right, var(--glow-two), transparent 32%),
        linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      padding: 18px;
    }

    body.blue {
      --bg-start: #020617;
      --bg-end: #0f172a;
      --glow-one: rgba(56, 189, 248, 0.22);
      --glow-two: rgba(14, 165, 233, 0.13);
      --accent: #38bdf8;
      --button-text: #082f49;
    }

    body.soft-rose {
      --bg-start: #120817;
      --bg-end: #1f1020;
      --glow-one: rgba(244, 114, 182, 0.26);
      --glow-two: rgba(219, 39, 119, 0.14);
      --accent: #f472b6;
      --button-text: #3b0824;
    }

    body.strong-rose {
      --bg-start: #170819;
      --bg-end: #2a1025;
      --glow-one: rgba(244, 114, 182, 0.34);
      --glow-two: rgba(219, 39, 119, 0.22);
      --accent: #f472b6;
      --button-text: #3b0824;
    }

    body.purple-pink {
      --bg-start: #10091b;
      --bg-end: #21112c;
      --glow-one: rgba(232, 121, 249, 0.28);
      --glow-two: rgba(192, 38, 211, 0.16);
      --accent: #e879f9;
      --button-text: #3b063f;
    }

    .app-shell {
      width: min(820px, 100%);
      margin: 0 auto;
    }

    .theme-buttons {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px 0 14px;
      backdrop-filter: blur(10px);
    }

    .theme-button {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(15, 23, 42, 0.72);
      color: #f9fafb;
      border-radius: 14px;
      padding: 11px 12px;
      font-weight: 800;
    }

    .theme-button.active {
      background: var(--accent);
      color: var(--button-text);
      border-color: transparent;
    }

    .preview-card {
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      margin-top: 12px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(2.3rem, 10vw, 4rem);
      letter-spacing: -0.06em;
    }

    h2 {
      margin: 0 0 12px;
    }

    p {
      color: #9ca3af;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .main-button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 900;
      background: var(--accent);
      color: var(--button-text);
    }

    .secondary-button {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 900;
      background: rgba(255,255,255,0.1);
      color: #f9fafb;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 14px;
    }

    .stat-number {
      display: block;
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      color: var(--accent);
    }

    .stat-label {
      color: #9ca3af;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .sample-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .sample-item {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15, 23, 42, 0.72);
      border-radius: 18px;
      padding: 14px;
    }

    .sample-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .sample-item span {
      color: #9ca3af;
    }

    .hex {
      margin-top: 16px;
      font-family: monospace;
      color: #d1d5db;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .theme-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="blue">

  <div class="app-shell">

    <div class="theme-buttons">
      <button class="theme-button active" data-theme="blue">Scott Blue</button>
      <button class="theme-button" data-theme="soft-rose">Soft Rose</button>
      <button class="theme-button" data-theme="strong-rose">Stronger Rose</button>
      <button class="theme-button" data-theme="purple-pink">Purple Pink</button>
    </div>

    <div class="preview-card">
      <h1>GymPilot</h1>
      <h2 id="themeTitle">Scott — Blue Theme</h2>
      <p id="themeDescription">Dark navy background with blue glow and blue accent buttons.</p>

      <div class="button-row">
        <button class="main-button">Start workout</button>
        <button class="secondary-button">Build routine</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-number">4</span>
          <span class="stat-label">Routines</span>
        </div>

        <div class="stat">
          <span class="stat-number">18</span>
          <span class="stat-label">Exercises</span>
        </div>

        <div class="stat">
          <span class="stat-number">7</span>
          <span class="stat-label">Workouts</span>
        </div>

        <div class="stat">
          <span class="stat-number">11</span>
          <span class="stat-label">PBs</span>
        </div>
      </div>

      <div class="sample-list">
        <div class="sample-item">
          <strong>Latest PB</strong>
          <span>Bench Press • Heaviest weight / resistance: 70</span>
        </div>

        <div class="sample-item">
          <strong>Last workout</strong>
          <span>Push Day • 6 completed sets</span>
        </div>
      </div>

      <div class="hex" id="themeHex">
        Background: #020617 → #0f172a<br />
        Accent: #38bdf8
      </div>
    </div>

  </div>

  <script>
    const themes = {
      "blue": {
        title: "Scott — Blue Theme",
        description: "Dark navy background with blue glow and blue accent buttons.",
        hex: "Background: #020617 → #0f172a<br />Accent: #38bdf8"
      },
      "soft-rose": {
        title: "Laurie — Soft Rose Theme",
        description: "Dark plum background with soft rose glow and rose accent buttons.",
        hex: "Background: #120817 → #1f1020<br />Accent: #f472b6"
      },
      "strong-rose": {
        title: "Laurie — Stronger Rose Theme",
        description: "A richer pink/plum background. Still dark and readable, but more obviously pink.",
        hex: "Background: #170819 → #2a1025<br />Accent: #f472b6"
      },
      "purple-pink": {
        title: "Purple Pink Theme",
        description: "A more purple/magenta version if Soft Rose feels too gentle.",
        hex: "Background: #10091b → #21112c<br />Accent: #e879f9"
      }
    };

    const buttons = document.querySelectorAll(".theme-button");
    const title = document.getElementById("themeTitle");
    const description = document.getElementById("themeDescription");
    const hex = document.getElementById("themeHex");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const theme = button.dataset.theme;

        document.body.className = theme;

        buttons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");

        title.innerHTML = themes[theme].title;
        description.innerHTML = themes[theme].description;
        hex.innerHTML = themes[theme].hex;
      });
    });
  </script>

</body>
</html>
